<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de produtor - AgroFeira</title>
    </head>

    <body>

        <header class="cabecalho-site">

            <h1>AgroFeira de Paragominas</h1>

            <nav aria-label="Principal">
                <ul class="menu">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="safra.html">Safra</a></li>
                    <li><a href="cadastro-produtor.html" aria-current="page">Cadastro de produtor</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                </ul>
            </nav>

        </header>

        <main id="conteudo">
            <form class="formulario-cadastro">
                
                <fieldset>
                    <legend>Quem é você?</legend>
                    <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            required>
                    
                    <p> 
                    <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>
                    </p>

                    <p> 
                    <label for="telefone">Telefone</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            autocomplete="tel"> 
                    </p>
                    
                    <p> 
                    <label for="caf">CAF</label>
                        <input
                            type="text"
                            id="caf"
                            name="caf">
                    </p>

                    <p> 
                    <label for="cep">CEP</label>
                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            inputmode="numeric"
                            pattern="[0-9]{5}-?[0-9]{3}"
                            aria-describedby="ajuda-cep">
                    </p>

                    <p id="ajuda-cep">Digite o CEP com ou sem hífen.</p>
                </fieldset>

                <fieldset>
                    <legend>O que você vende?</legend>

                    <p>        
                        <label for="produto">Produto</label>
                        <select id="produto" name="produto" required>
                            <option value="">Escolha um produto</option>
                            <option value="mandioca">Mandioca</option>
                            <option value="banana-prata">Banana-prata</option>
                            <option value="acai">Açaí</option>
                            <option value="pimenta-do-reino">Pimenta-do-reino</option>
                            <option value="cupuacu">Cupuaçu</option>
                            <option value="alface">Alface</option>
                        </select>
                    </p>

                    <p>
                        <label for="quantidade">Quantidade</label>
                        <input
                            type="number"
                            id="quantidade"
                            name="quantidade"
                            min="1"
                            max="500"
                            step="1"
                            required>
                    </p>

                    <p>
                        <label for="data-inicio">Data de início</label>
                        <input
                            type="date"
                            id="data-inicio"
                            name="data-inicio">
                    </p>

                    <p>Entrega</p>
                    
                    <p> 
                        <label>
                            <input type="radio" name="entrega" value="leva-feira">
                            Leva à feira
                        </label>
                    </p>
                    
                    <p> 
                        <label>
                            <input type="radio" name="entrega" value="retira-propriedade">
                            A feira retira na propriedade
                        </label>
                    </p>
                    
                    <p> 
                        <label for="observacao">Observações</label>
                            <textarea id="observacao" name="observacao" rows="4" cols="40"></textarea>
                        
                        <label>
                            <input type="checkbox" name="regras" required>
                            Concordo com as regras da AgroFeira.
                        </label>
                    </p>

                    <p>
                        <button type="submit">Cadastrar produtor</button>
                    </p>

                </fieldset>
            </form>

        </main>

        <footer class="rodape-site">
            <p>© 2026 AgroFeira de Paragominas. Todos os direitos reservados.</p>
        </footer>

    </body>

</html>
